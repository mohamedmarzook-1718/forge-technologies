<svg viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="svg-silver-top" x1="20" y1="15" x2="90" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="svg-silver-bottom" x1="20" y1="65" x2="90" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="svg-silver-center" x1="30" y1="40" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="svg-arrow-gold" x1="50" y1="60" x2="95" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- EMBLEM -->
  <g transform="translate(10, 8)">
    <!-- TIME: Upper Hourglass Chamber -->
    <path d="M 26 18 L 74 18 L 59 43 L 41 43 Z" fill="url(#svg-silver-top)" />
    <path d="M 26 18 L 50 10 L 74 18 L 50 25 Z" fill="#FFFFFF" opacity="0.85" />

    <!-- FORGE: Central Anvil / Hammer Connection -->
    <path d="M 41 43 L 59 43 L 63 61 L 37 61 Z" fill="url(#svg-silver-center)" />
    <path d="M 50 43 L 50 61" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" />

    <!-- 2 M & INFINITY: Interlocking Monogram & Base Chamber -->
    <path d="M 20 40 L 37 61 L 27 75 L 12 55 Z" fill="#CBD5E1" opacity="0.95" />
    <path d="M 37 61 L 63 61 L 74 90 L 26 90 Z" fill="url(#svg-silver-bottom)" />
    <path d="M 26 90 L 50 101 L 74 90 L 50 83 Z" fill="#64748B" opacity="0.7" />

    <!-- UPWARD ARROW: Kinetic Vector Wing & Gold Tip -->
    <path d="M 63 61 L 79 38 L 88 21 L 76 23 L 71 40 L 59 43 Z" fill="url(#svg-arrow-gold)" />
    <path d="M 88 21 L 85 30 L 79 28 Z" fill="#F59E0B" />

    <!-- Outer Structural Wire Edge -->
    <path d="M 26 18 L 74 18 L 88 21 L 63 61 L 74 90 L 26 90 L 37 61 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(130, 0)">
    <!-- FORGE -->
    <text x="0" y="66" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="0.18em">
      FORGE
    </text>
    <!-- TECHNOLOGIES -->
    <text x="3" y="93" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14.5" letter-spacing="0.42em">
      TECHNOLOGIES
    </text>
  </g>
</svg>
