    <meta name="theme-color" content="#070B12" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('forge-theme');
          var isLight = stored === 'light' || (stored === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isLight) {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', '#F8FAFC');
          } else {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', '#070B12');
          }
        } catch (e) {}
      })();
    </script>
